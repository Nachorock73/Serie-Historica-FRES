name: Publicar series FRES
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Validar los CSV con el mismo lector de los gráficos
        shell: bash
        run: |
          node --check assets/viewer.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const source=fs.readFileSync('assets/csv-worker.js','utf8');
          const {parseCsv}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          for(const code of ['A00','A01','A02','A04','A05','J04','P01']) {
            const data=parseCsv(fs.readFileSync(`merged/${code}_merged.csv`,'utf8'));
            if(!data.columns.length)throw new Error(`${code}: no hay variables con datos.`);
            const forbidden={A01:['condfr'],A04:['temp']}[code]||[];
            for(const column of data.columns) {
              const key=column.name.toLowerCase().replace(/[^a-z0-9]/g,'');
              if(forbidden.includes(key))throw new Error(`${code}: retirar la columna ${column.name} del consolidado antes de publicar.`);
            }
            console.log(`${code}: ${data.dates.length} registros, ${data.columns.length} variables.`);
          }
          JS
      - name: Calcular vista previa desde los CSV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, math, re, shutil, json, subprocess
          from datetime import datetime

          root = Path('.')
          page = (root / 'index.html').read_text(encoding='utf-8')
          updates = {}
          def card(match):
              code, heading = match.group(1), match.group(2)
              csv_path = f'merged/{code}_merged.csv'
              updated_at = subprocess.check_output(['git','log','-1','--format=%cI','--',csv_path],text=True).strip()
              commit = subprocess.check_output(['git','log','-1','--format=%H','--',csv_path],text=True).strip()
              if not updated_at:
                  raise ValueError(f'{code}: no se encontró el historial del CSV')
              updates[code] = {'updated_at': updated_at, 'commit': commit}
              count = 0
              available = set()
              first = last = None
              with (root / 'merged' / f'{code}_merged.csv').open(encoding='utf-8-sig', newline='') as handle:
                  reader = csv.DictReader(handle)
                  reader.fieldnames = [name.strip() for name in reader.fieldnames]
                  for row in reader:
                      stamp = datetime.fromisoformat(row['Date'].strip())
                      first = min(first, stamp) if first else stamp
                      last = max(last, stamp) if last else stamp
                      count += 1
                      for name, value in row.items():
                          value = (value or '').strip()
                          if name == 'Date' or not value or value.lower() in ('na', 'nan', 'null'):
                              continue
                          if math.isfinite(float(value)):
                              available.add(name)
              if not count:
                  raise ValueError(f'{code}: CSV sin registros')
              records = f'{count:,}'.replace(',', '.')
              period = f'{first:%d/%m/%Y} — {last:%d/%m/%Y}'
              details = f'<div class="card-details"><p class="period">{period}</p><p class="counts"><strong>{len(available)}</strong> variables · <strong>{records}</strong> registros</p></div>'
              return f'<a class="card" href="{code}.html"><h2>{heading}</h2>{details}<span>Abrir gráfico</span></a>'
          pattern = r'<a class="card" href="([A-Z][0-9]{2})\.html"><h2>(.*?)</h2>.*?</a>'
          page, updated = re.subn(pattern, card, page, flags=re.S)
          if updated != 7:
              raise ValueError(f'Se esperaban siete tarjetas; encontradas: {updated}')
          (root / 'index.html').write_text(page, encoding='utf-8')
          output = root / '_site'
          output.mkdir(exist_ok=True)
          for file in root.glob('*.html'):
              shutil.copyfile(file, output / file.name)
          for folder in ('assets', 'merged'):
              shutil.copytree(root / folder, output / folder, dirs_exist_ok=True)
          (output / 'assets/updates.json').write_text(json.dumps(updates,ensure_ascii=False,indent=2),encoding='utf-8')
          (output / '.nojekyll').touch()
          print('Siete tarjetas actualizadas desde CSV.')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
